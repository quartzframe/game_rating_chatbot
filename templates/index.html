<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRate AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #222b5a, #0b1020 55%, #060812);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            width: min(950px, 100%);
            height: min(760px, 92vh);
            background: rgba(14, 19, 38, .94);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 22px 26px;
            background: linear-gradient(135deg, #6d5dfc, #3a8dff);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { display: flex; gap: 13px; align-items: center; }
        .logo {
            width: 46px; height: 46px; border-radius: 14px;
            background: rgba(255,255,255,.18);
            display: grid; place-items: center; font-size: 24px;
        }
        h1 { font-size: 22px; }
        .subtitle { opacity: .82; font-size: 12px; margin-top: 3px; }
        .status {
            font-size: 12px; padding: 7px 11px;
            border-radius: 999px; background: rgba(0,0,0,.18);
        }
        #chat {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .message { max-width: 78%; line-height: 1.5; white-space: pre-wrap; }
        .bot {
            align-self: flex-start;
            background: #1d2645; border: 1px solid #303b62;
            padding: 14px 17px; border-radius: 18px 18px 18px 5px;
        }
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6d5dfc, #3a8dff);
            padding: 14px 17px; border-radius: 18px 18px 5px 18px;
        }
        .quick {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 0 24px 14px;
        }
        .quick button {
            border: 1px solid #344064; color: #dce5ff;
            background: #151c34; border-radius: 999px;
            padding: 9px 13px; cursor: pointer;
        }
        .quick button:hover { background: #222d50; }
        form {
            display: flex; gap: 10px; padding: 17px 20px;
            border-top: 1px solid #252e4c; background: #0d1327;
        }
        input {
            flex: 1; border: 1px solid #344064; outline: none;
            background: #151c34; color: white; padding: 15px 17px;
            border-radius: 14px; font-size: 15px;
        }
        input:focus { border-color: #6d5dfc; }
        #send {
            border: 0; color: white; cursor: pointer;
            background: linear-gradient(135deg, #6d5dfc, #3a8dff);
            border-radius: 14px; padding: 0 21px; font-weight: bold;
        }
        @media (max-width: 600px) {
            .app { height: 95vh; border-radius: 16px; }
            .message { max-width: 88%; }
            header { padding: 17px; }
            #chat { padding: 17px; }
            .quick { padding: 0 17px 12px; }
            form { padding: 13px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <div class="logo">🎮</div>
            <div>
                <h1>GameRate AI</h1>
                <div class="subtitle">AI-powered game rating & review assistant</div>
            </div>
        </div>
        <div class="status">● Online</div>
    </header>

    <main id="chat">
        <div class="message bot">
            Hi! I'm GameRate AI 🎮<br><br>
            Ask me to rate or review a game.<br>
            Example: <b>"Rate GTA V on PC"</b>
        </div>
    </main>

    <div class="quick">
        <button onclick="quickAsk('Rate GTA V on PC')">Rate GTA V</button>
        <button onclick="quickAsk('Review Minecraft')">Review Minecraft</button>
        <button onclick="quickAsk('Rate Valorant for gameplay')">Rate Valorant</button>
        <button onclick="quickAsk('What should I check before buying a game?')">Rating factors</button>
    </div>

    <form id="chatForm">
        <input id="message" autocomplete="off"
               placeholder="Ask about a game..." required>
        <button id="send" type="submit">Send</button>
    </form>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const form = document.getElementById("chatForm");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function quickAsk(text) {
    input.value = text;
    form.requestSubmit();
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    addMessage("Thinking... 🎮", "bot");
    const thinking = chat.lastElementChild;

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });

        const data = await res.json();
        thinking.remove();
        addMessage(data.reply || "No response received.", "bot");
    } catch (err) {
        thinking.remove();
        addMessage("Unable to connect to the server. Please try again.", "bot");
    }
});
</script>
</body>
</html>
